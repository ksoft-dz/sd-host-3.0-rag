# ==============================================================================
# RAG V2 — Spec Configuration
# ==============================================================================
# This file replaces ALL hardcoded values from v1 extraction scripts.
# One config per project. Everything the pipeline needs to know about the spec.
# ==============================================================================

# ==============================================================================
# SPEC IDENTITY
# ==============================================================================
spec:
  name: "SD Host Controller Simplified Specification"
  version: "3.00"
  pdf_file: "source/sd_host_3_00.pdf"
  page_offset: 11          # spec_page + page_offset = pdf_page (1-indexed)
  total_spec_pages: 141     # Last numbered spec page

# ==============================================================================
# TABLE OF CONTENTS — PDF page indices (0-indexed) where each TOC lives
# ==============================================================================
toc:
  sections:
    pages: [3, 4, 5, 6]    # PDF pages 4-7 (0-indexed: 3-6)
    pattern: "^(\\d+(?:\\.\\d+)*)\\s+(.+?)\\s*\\.{3,}\\s*(\\d+)"
  tables:
    pages: [9, 10]          # PDF pages 10-11 (0-indexed: 9-10)
    pattern: "Table\\s+(\\d+)[-.](\\d+)\\s*:\\s*(.+?)\\.{3,}\\s*(\\d+)"
    id_format: "TABLE_{chapter}_{seq}"
  figures:
    pages: [7, 8]           # PDF pages 8-9 (0-indexed: 7-8)
    pattern: "Figure\\s+(\\d+)[-.](\\d+)\\s*:\\s*(.+?)\\.{3,}\\s*(\\d+)"
    id_format: "FIG_{chapter}_{seq}"

# ==============================================================================
# NODE TYPES — Same 7 types as SD Host v1
# ==============================================================================
node_types:
  TABLE:
    enabled: true
    id_format: "TABLE_{chapter}_{seq}"
    classification_rules:
      - pattern: "register.*(field|bit)"
        type: "REGISTER_FIELDS"
      - pattern: "register"
        type: "REGISTER_MAP"
      - pattern: "signal|port"
        type: "SIGNAL_LIST"
      - pattern: "timing"
        type: "TIMING"
      - pattern: ".*"
        type: "OTHER"

  FIGURE:
    enabled: true
    id_format: "FIG_{chapter}_{seq}"
    classification_rules:
      - pattern: "state|machine|transition"
        type: "STATE_DIAGRAM"
      - pattern: "timing|waveform"
        type: "TIMING_DIAGRAM"
      - pattern: "register.*(bit|field|layout)"
        type: "REGISTER_LAYOUT"
      - pattern: "flow|sequence"
        type: "FLOWCHART"
      - pattern: "block|architecture|diagram"
        type: "BLOCK_DIAGRAM"
      - pattern: ".*"
        type: "OTHER"

  SPEC_CHUNK:
    enabled: true
    id_format: "CHUNK_{section}_{idx}"

  REGISTER:
    enabled: true
    id_format: "REG_{offset}"

  REG_CLASS:
    enabled: true
    id_format: "REGCLASS_{name}"

  FEATURE:
    enabled: true
    id_format: "F_{name}"

  HD_SEQUENCE:
    enabled: true
    id_format: "HD_{name}"

# ==============================================================================
# CHUNKING PARAMETERS
# ==============================================================================
chunking:
  target_words: 200
  max_words: 250
  overlap_words: 20

# ==============================================================================
# LLM CONFIGURATION
# ==============================================================================
llm:
  default_model: "sonnet"
  models:
    haiku: "claude-haiku-4-5-20251001"
    sonnet: "claude-sonnet-4-5-20250929"
    opus: "claude-opus-4-5-20251101"
  rate_limit_delay: 1.5
  max_retries: 3
  max_workers: 4

# ==============================================================================
# DOMAIN: REGISTERS
# ==============================================================================
domain:
  registers:
    enabled: true
    # Register classes from FIG_1_2 (address map) + TABLE_1_1 (version support)
    classes:
      - id: "REGCLASS_CMD_GEN"
        name: "SD Command Generation"
        address_start: "000h"
        address_end: "00Fh"
        table_1_1_name: "SD command generation"
      - id: "REGCLASS_RESPONSE"
        name: "Response"
        address_start: "010h"
        address_end: "01Fh"
        table_1_1_name: "Response"
      - id: "REGCLASS_BUFFER"
        name: "Buffer Data Port"
        address_start: "020h"
        address_end: "023h"
        table_1_1_name: "Buffer Data port"
      - id: "REGCLASS_HOST_CTRL1"
        name: "Host Control 1 and Others"
        address_start: "024h"
        address_end: "02Fh"
        table_1_1_name: "Host control 1 and Others"
      - id: "REGCLASS_INTERRUPT"
        name: "Interrupt Controls"
        address_start: "030h"
        address_end: "03Dh"
        table_1_1_name: "Interrupt controls"
      - id: "REGCLASS_HOST_CTRL2"
        name: "Host Control 2"
        address_start: "03Eh"
        address_end: "03Fh"
        table_1_1_name: "Host Control 2"
      - id: "REGCLASS_CAPABILITIES"
        name: "Capabilities"
        address_start: "040h"
        address_end: "04Fh"
        table_1_1_name: "Capabilities"
      - id: "REGCLASS_FORCE_EVENT"
        name: "Force Event"
        address_start: "050h"
        address_end: "053h"
        table_1_1_name: "Force Event"
      - id: "REGCLASS_ADMA"
        name: "ADMA"
        address_start: "054h"
        address_end: "05Fh"
        table_1_1_name: "ADMA"
      - id: "REGCLASS_PRESET"
        name: "Preset Value"
        address_start: "060h"
        address_end: "06Fh"
        table_1_1_name: "Preset Value"
      - id: "REGCLASS_SHARED_BUS"
        name: "Shared Bus"
        address_start: "0E0h"
        address_end: "0E3h"
        table_1_1_name: "Shared Bus"
      - id: "REGCLASS_COMMON"
        name: "Common Area"
        address_start: "0F0h"
        address_end: "0FFh"
        table_1_1_name: "Common area"

    # Register offset → section/name mapping
    register_offsets:
      "000h": { section: "2.2.1",  name: "SDMA System Address / Argument 2 Register" }
      "004h": { section: "2.2.2",  name: "Block Size Register" }
      "006h": { section: "2.2.3",  name: "Block Count Register" }
      "008h": { section: "2.2.4",  name: "Argument 1 Register" }
      "00Ch": { section: "2.2.5",  name: "Transfer Mode Register" }
      "00Eh": { section: "2.2.6",  name: "Command Register" }
      "010h": { section: "2.2.7",  name: "Response Register", table: "TABLE_2_11" }
      "020h": { section: "2.2.8",  name: "Buffer Data Port Register" }
      "024h": { section: "2.2.9",  name: "Present State Register" }
      "028h": { section: "2.2.10", name: "Host Control 1 Register" }
      "029h": { section: "2.2.11", name: "Power Control Register" }
      "02Ah": { section: "2.2.12", name: "Block Gap Control Register" }
      "02Bh": { section: "2.2.13", name: "Wakeup Control Register" }
      "02Ch": { section: "2.2.14", name: "Clock Control Register" }
      "02Eh": { section: "2.2.15", name: "Timeout Control Register" }
      "02Fh": { section: "2.2.16", name: "Software Reset Register" }
      "030h": { section: "2.2.17", name: "Normal Interrupt Status Register" }
      "032h": { section: "2.2.18", name: "Error Interrupt Status Register" }
      "034h": { section: "2.2.19", name: "Normal Interrupt Status Enable Register" }
      "036h": { section: "2.2.20", name: "Error Interrupt Status Enable Register" }
      "038h": { section: "2.2.21", name: "Normal Interrupt Signal Enable Register" }
      "03Ah": { section: "2.2.22", name: "Error Interrupt Signal Enable Register" }
      "03Ch": { section: "2.2.23", name: "Auto CMD Error Status Register" }
      "03Eh": { section: "2.2.24", name: "Host Control 2 Register" }
      "040h": { section: "2.2.25", name: "Capabilities Register" }
      "048h": { section: "2.2.26", name: "Maximum Current Capabilities Register" }
      "050h": { section: "2.2.27", name: "Force Event Register for Auto CMD Error Status", table: "TABLE_2_37" }
      "052h": { section: "2.2.28", name: "Force Event Register for Error Interrupt Status" }
      "054h": { section: "2.2.29", name: "ADMA Error Status Register" }
      "058h": { section: "2.2.30", name: "ADMA System Address Register" }
      "060h": { section: "2.2.31", name: "Preset Value Registers", table: "TABLE_2_43" }
      "0E0h": { section: "2.2.32", name: "Shared Bus Control Register" }
      "0F0h": { section: "2.2.33", name: "Slot Interrupt Status Register" }
      "0FEh": { section: "2.2.34", name: "Host Controller Version Register", table: "TABLE_2_46" }

    # Tables to EXCLUDE from register field extraction
    exclude_tables:
      - "TABLE_1_1"    # Supported Registers summary
      - "TABLE_1_2"    # Registers to Generate SD Command (summary)
      - "TABLE_1_3"    # Response Register content mapping
      - "TABLE_1_4"    # Available Byte Enable Pattern
      - "TABLE_1_5"    # Host Control Registers summary
      - "TABLE_1_6"    # Host Control Registers (cont)
      - "TABLE_1_7"    # Summary of Register Status
      - "TABLE_1_8"    # Summary for Data Transfer
      - "TABLE_1_9"    # Data Line Active summary
      - "TABLE_1_10"   # Auto CMD status
      - "TABLE_1_11"   # Auto CMD fields
      - "TABLE_1_13"   # PCI config registers
      - "TABLE_1_14"   # PCI stuff
      - "TABLE_2_1"    # Register map layout
      - "TABLE_2_2"    # Available Byte Enable Pattern
      - "TABLE_2_8"    # Multi/Single Block function table
      - "TABLE_2_10"   # Response Type mapping
      - "TABLE_2_11"   # Response Register mapping
      - "TABLE_2_12"   # Response Register mapping (duplicate)
      - "TABLE_2_25"   # CMD CRC/Timeout error table
      - "TABLE_2_31"   # Auto CMD error table
      - "TABLE_2_36"   # Current value conversion
      - "TABLE_2_41"   # Preset Value offset mapping
      - "TABLE_2_42"   # Bus Speed Mode selection
      - "TABLE_2_46"   # Host Controller Version values

# ==============================================================================
# DOMAIN: FEATURES
# ==============================================================================
