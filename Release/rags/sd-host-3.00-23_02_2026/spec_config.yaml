      - { id: "F_POWER",              name: "Power Control",                    groups: ["power"],                   priority: "P0", parent: null }
      - { id: "F_BUS_POWER_VOLTAGE",  name: "Bus Power and Voltage Select",    groups: ["power"],                   priority: "P0", parent: "F_POWER" }
      - { id: "F_POWER_STATES",       name: "Power States D0-D3",              groups: ["power"],                   priority: "P1", parent: "F_POWER" }
      - { id: "F_1V8_SIGNALING",      name: "1.8V Signaling Enable",           groups: ["power", "speed_modes"],    priority: "P2", parent: "F_POWER" }

      # --- BUS WIDTH (§3.4) ---
      - { id: "F_BUS_WIDTH",          name: "Bus Width Control",                groups: ["bus_width"],               priority: "P0", parent: null }

      # --- SPEED MODES (§3.9) ---
      - { id: "F_SPEED_MODES",        name: "Speed Mode Support",              groups: ["speed_modes"],             priority: "P0", parent: null }
      - { id: "F_DEFAULT_SPEED",      name: "Default Speed Mode",              groups: ["speed_modes"],             priority: "P0", parent: "F_SPEED_MODES" }
      - { id: "F_HIGH_SPEED",         name: "High Speed Mode",                 groups: ["speed_modes"],             priority: "P0", parent: "F_SPEED_MODES" }
      - { id: "F_UHS_SDR50",          name: "UHS-I SDR50",                     groups: ["speed_modes"],             priority: "P2", parent: "F_SPEED_MODES" }
      - { id: "F_UHS_SDR104",         name: "UHS-I SDR104",                    groups: ["speed_modes"],             priority: "P2", parent: "F_SPEED_MODES" }
