      - { id: "HDS_ASYNC_ABORT",         name: "Asynchronous Abort Sequence",          groups: ["error_handling", "host_driver_sequence"],               primary_section: "3.8.1" }
      - { id: "HDS_SYNC_ABORT",          name: "Synchronous Abort Sequence",           groups: ["error_handling", "host_driver_sequence"],               primary_section: "3.8.2" }
      - { id: "HDS_ERR_INT_RECOVERY",    name: "Error Interrupt Recovery Sequence",    groups: ["error_handling", "host_driver_sequence"],               primary_section: "3.10.1" }
      - { id: "HDS_AUTO_CMD12_RECOVERY", name: "Auto CMD12 Error Recovery Sequence",   groups: ["auto_cmd", "error_handling", "host_driver_sequence"],   primary_section: "3.10.2" }
      - { id: "HDS_SUSPEND",             name: "Suspend Sequence",                     groups: ["block_gap", "host_driver_sequence"],                    primary_section: "3.12" }
      - { id: "HDS_RESUME",              name: "Resume Sequence",                      groups: ["block_gap", "host_driver_sequence"],                    primary_section: "3.12" }
      - { id: "HDS_BUS_SPEED_CHANGE",    name: "Bus Speed Mode Change Sequence",       groups: ["speed_modes", "host_driver_sequence"],                  primary_section: "3.9" }

# ==============================================================================
# RELATION TYPES — Same as v1
# ==============================================================================
relation_types:
  - { type: "REFERENCES",          description: "Node mentions table/figure" }
  - { type: "CHILD_OF",            description: "Section hierarchy" }
  - { type: "DEFINED_BY",          description: "Register fields from table" }
  - { type: "VISUALIZED_BY",       description: "Register layout in figure" }
  - { type: "DESCRIBES",           description: "Resource documents register" }
  - { type: "BELONGS_TO",          description: "Register in functional class" }
  - { type: "DEFINED_IN",          description: "Register defined in table" }
  - { type: "PART_OF",             description: "Sub-feature belongs to parent" }
  - { type: "USES_FEATURE",        description: "Sequence depends on feature" }
  - { type: "HIGHLY_RELATED_TO",   description: "Strong cross-feature relation" }
  - { type: "SLIGHTLY_RELATED_TO", description: "Weak cross-feature relation" }

# ==============================================================================
# EXTRACTION — Table & figure extraction behaviour
# ==============================================================================
extraction:
  tables:
    multi_page:
      enabled: true
      max_pages_before: 2     # scan up to N pages before the title page
      max_pages_after: 2      # scan up to N pages after the title page

    # Extraction hints: config-driven instructions injected into the LLM prompt
    # when a table title matches one of the hint patterns.
    # This keeps the scripts generic while letting the user steer the LLM.
    hints:
      - name: "register_fields"
        match_title: "register"                   # regex matched against title
        expected_columns:
          - { role: "bit_range",   names: ["Bit", "Location", "Bit Position", "Bit Range", "Bits"] }
          - { role: "access",      names: ["Access", "Attrib", "Type", "R/W", "Attribute"] }
          - { role: "field_name",  names: ["Field Name", "Signal Name", "Name", "Field"] }
          - { role: "description", names: ["Description", "Function", "Explanation"] }
        instruction: |
          This is a hardware register field table.
          Extract it with EXACTLY these 4 CSV columns:
            Bit,Access,Field Name,Description
          Rules:
          - "Bit" = bit range or position (e.g. "31-16", "07", "15-00")
          - "Access" = access type abbreviation (e.g. "RW", "RO", "ROC", "RW1C")
          - "Field Name" = ONLY the short field name (e.g. "DMA Enable"), NOT the full description paragraph
          - "Description" = the full description text
          If the original table merges field name and description into one column,
          split them: the first line is the field name, the rest is the description.
          Do NOT include Reserved fields.

  figures:
    multi_page:
      enabled: false
      max_pages_before: 1
      max_pages_after: 1

# ==============================================================================
# VALIDATION — Post-extraction sanity checks (Haiku, fast + cheap)
# ==============================================================================
validation:
  enabled: true
  model: "haiku"                  # cheap model for sanity checks
  checks:
    registers:
      enabled: true
      rules:
        - check: "field_name_length"
          max_chars: 80           # field name > N chars ⇒ suspicious (likely raw dump)
        - check: "missing_bits"
          severity: "warning"     # fields with empty bit range
        - check: "missing_access"
          severity: "warning"     # fields with empty access type
        - check: "zero_fields"
          severity: "error"       # register with 0 extracted fields
    tables:
      enabled: true
      rules:
        - check: "empty_csv"
          severity: "error"       # CSV < 10 bytes
        - check: "single_row"
          severity: "warning"     # only header, no data rows
    figures:
      enabled: true
      rules:
        - check: "empty_plantuml"
          severity: "error"
        - check: "no_startuml"
          severity: "warning"     # missing @startuml / @enduml
