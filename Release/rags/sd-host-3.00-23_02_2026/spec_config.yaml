      - { id: "F_REG_FILE",           name: "Register File",                    groups: ["register_infrastructure"], priority: "P1", parent: null }
      - { id: "F_REG_ACCESS_TYPES",   name: "Register Access Types",            groups: ["register_infrastructure"], priority: "P1", parent: "F_REG_FILE" }
      - { id: "F_REG_INIT_VALUES",    name: "Register Initial Values",          groups: ["register_infrastructure"], priority: "P1", parent: "F_REG_FILE" }
      - { id: "F_REG_RESERVED_BITS",  name: "Reserved Bits Handling",           groups: ["register_infrastructure"], priority: "P1", parent: "F_REG_FILE" }

      # --- COMMAND ENGINE (§1.5, §3.7.1) ---
      - { id: "F_CMD_ENGINE",         name: "Command Engine",                   groups: ["command"],                 priority: "P0", parent: null }
      - { id: "F_CMD_ISSUANCE",       name: "Command Issuance",                 groups: ["command"],                 priority: "P0", parent: "F_CMD_ENGINE" }
      - { id: "F_CMD_FINALIZATION",    name: "Command Finalization",             groups: ["command"],                 priority: "P0", parent: "F_CMD_ENGINE" }
      - { id: "F_CMD_INHIBIT",        name: "Command Inhibit",                  groups: ["command"],                 priority: "P0", parent: "F_CMD_ENGINE" }
      - { id: "F_RESPONSE",           name: "Response Handling",                groups: ["command", "response"],     priority: "P0", parent: "F_CMD_ENGINE" }

      # --- DATA TRANSFER (§1.4, §1.7, §1.13, §3.7.2) ---
