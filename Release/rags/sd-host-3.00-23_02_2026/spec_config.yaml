      - { id: "F_BUFFER",             name: "Buffer Data Port",                 groups: ["buffer", "data_transfer"], priority: "P0", parent: "F_DATA_TRANSFER" }
      - { id: "F_PIO",                name: "Programmed I/O",                   groups: ["pio", "data_transfer"],    priority: "P0", parent: "F_DATA_TRANSFER" }
      - { id: "F_SDMA",               name: "Single DMA",                       groups: ["sdma", "dma", "data_transfer"], priority: "P0", parent: "F_DATA_TRANSFER" }
      - { id: "F_ADMA2",              name: "Advanced DMA 2",                   groups: ["adma2", "dma", "data_transfer"], priority: "P0", parent: "F_DATA_TRANSFER" }
      - { id: "F_ADMA2_DESC",         name: "ADMA2 Descriptor Table",           groups: ["adma2"],                   priority: "P0", parent: "F_ADMA2" }
      - { id: "F_ADMA2_STATES",       name: "ADMA2 State Machine",             groups: ["adma2"],                   priority: "P0", parent: "F_ADMA2" }
      - { id: "F_BLOCK_SIZE_COUNT",   name: "Block Size and Count",             groups: ["data_transfer"],           priority: "P0", parent: "F_DATA_TRANSFER" }
      - { id: "F_LARGE_DATA_DIV",     name: "Large Data Transfer Division",     groups: ["data_transfer"],           priority: "P1", parent: "F_DATA_TRANSFER" }

      # --- AUTO CMD (§1.11) ---
