      - { id: "F_AUTO_CMD12",         name: "Auto CMD12",                       groups: ["auto_cmd"],                priority: "P0", parent: "F_AUTO_CMD" }
      - { id: "F_AUTO_CMD23",         name: "Auto CMD23",                       groups: ["auto_cmd"],                priority: "P0", parent: "F_AUTO_CMD" }

      # --- INTERRUPT SYSTEM (§1.8, §2.2.17–2.2.22) ---
      - { id: "F_INTERRUPT",          name: "Interrupt System",                 groups: ["interrupt"],               priority: "P0", parent: null }
      - { id: "F_INT_NORMAL_STATUS",  name: "Normal Interrupt Status",          groups: ["interrupt"],               priority: "P0", parent: "F_INTERRUPT" }
      - { id: "F_INT_ERROR_STATUS",   name: "Error Interrupt Status",           groups: ["interrupt", "error_handling"], priority: "P0", parent: "F_INTERRUPT" }
